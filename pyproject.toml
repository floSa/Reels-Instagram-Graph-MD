[project]
name = "reels-graph-md"
version = "0.1.0"
description = "Transforme des reels sauvegardés (Instagram / TikTok / Facebook) en vault Obsidian consultable"
requires-python = ">=3.12"

# Aucune dépendance Python : tout passe par des binaires externes (yt-dlp,
# ffmpeg) et par le moteur de transcription de `watch`, lui-même en stdlib pure.
dependencies = []

[project.scripts]
reels-ingest = "reels_graph_md.ingest:main"
reels-mailler = "reels_graph_md.mailler:main"
reels-verifier = "reels_graph_md.verifier:main"
reels-enrichir = "reels_graph_md.enrichir:main"
reels-chercher = "reels_graph_md.chercher:main"
reels-carte = "reels_graph_md.carte:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_graph_md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
